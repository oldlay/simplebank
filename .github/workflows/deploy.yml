# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Deploy to production

on:
  push:
    branches: [ "main" ]

jobs:

  build:
    name: Build image
    runs-on: ubuntu-latest

    steps:
      - name: Login to ACR
        uses: aliyun/acr-login@v1
        with:
          login-server: crpi-2z1z1mrz3i81o8x8.cn-guangzhou.personal.cr.aliyuncs.com
          username: "${{ secrets.REGISTRY_USERNAME }}"
          password: "${{ secrets.REGISTRY_PASSWORD }}"
      - name: Build and push image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t crpi-2z1z1mrz3i81o8x8.cn-guangzhou.personal.cr.aliyuncs.com/simple_bank/simplebank:$IMAGE_TAG .
          docker push crpi-2z1z1mrz3i81o8x8.cn-guangzhou.personal.cr.aliyuncs.com/simple_bank/simplebank:$IMAGE_TAG
        


    

