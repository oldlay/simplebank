syntax = "proto3";

package pb;

import "google/protobuf/timestamp.proto";
import "google/type/decimal.proto";


option go_package = "github.com/oldlay/simplebank/pb";

message Account {
    int64 id = 1;
    string owner = 2;
    string currency = 3;
    google.type.Decimal amount = 4;
    google.protobuf.Timestamp create_at = 5;
}
