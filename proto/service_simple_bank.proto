syntax = "proto3";

package pb;

import "rpc_create_user.proto";
import "rpc_login_user.proto";
import "rpc_update_user.proto";
import "rpc_verify_email.proto";
import "rpc_create_account.proto";
import "rpc_get_account.proto";
import "rpc_list_account.proto";
import "rpc_update_account.proto";
import "rpc_delete_account.proto";
import "rpc_create_transfer.proto";
import "rpc_get_account_by_owner.proto";
import "rpc_get_exchange_rate.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/oldlay/simplebank/pb";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title  : "Simple Bank API"
    version: "1.2"
    contact: {
      name : "oldlay"
      url  : "https://github.com/oldlay"
      email: "oldlay239@gmail.com"
    }
  }
};

// SimpleBank 服务提供了与银行相关的操作，例如账户管理和交易处理。
// 这是一个示例服务，展示如何定义 gRPC 服务。
service SimpleBank {
    // 定义创建用户的 RPC 方法
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {
    option (google.api.http) = {
      post: "/v1/create_user"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      description: "Use this API to create a new user"
      summary    : "Create new user"
    };
  }

  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse) {
    option (google.api.http) = {
      patch: "/v1/update_user"
      body : "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      description: "Use this API to update user"
      summary    : "Create new user"
    };
  }
    // 定义登录用户的 RPC 方法
  rpc LoginUser(LoginUserRequest) returns (LoginUserResponse) {
    option (google.api.http) = {
      post: "/v1/login_user"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      description: "Use this API to login user and get access token & refresh token"
      summary    : "login user"
    };
  }

  rpc VerifyEmail(VerifyEmailRequest) returns (VerifyEmailResponse) {
    option (google.api.http) = {
      get: "/v1/verify_email"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      description: "Use this API to verify user's email address";
      summary    : "verify email";
    };
  }

  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse) {
    option (google.api.http) = {
      post: "/v1/create_account"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      description: "Use this API to create a new account"
      summary    : "Create new account"
    };
  }

  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse) {
    option (google.api.http) = {
      get: "/v1/get_account/{id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      description: "Use this API to create a new account"
      summary    : "Get new account"
    };
  }
  rpc ListAccount(ListAccountRequest) returns (ListAccountResponse) {
    option (google.api.http) = {
      get: "/v1/list_account"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      description: "Use this API to list all new accounts"
      summary    : "list all accounts"
    };
  }
  rpc UpdateAccount(UpdateAccountRequest) returns (UpdateAccountResponse) {
    option (google.api.http) = {
      patch: "/v1/update_account/{id}"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      description: "Use this API to update a account"
      summary    : "update a account"
    };
  }
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse) {
    option (google.api.http) = {
      delete: "/v1/delete_account/{id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      description: "Use this API to delete a account"
      summary    : "delete a account"
    };
  }
  rpc CreateTransfer(CreateTransferRequest) returns (CreateTransferResponse) {
    option (google.api.http) = {
      post: "/v1/create_transfer"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      description: "Use this API to create a transfer"
      summary    : "create a transfer"
    };
  }
  rpc GetAccountByOwner(GetAccountByOwnerRequest) returns (GetAccountByOwnerResponse) {
    option (google.api.http) = {
        get: "/v1/get_account_by_owner"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
        description: "Look up an account by owner and currency"
        summary: "get account by owner"
    };
  }
  rpc GetExchangeRate(GetExchangeRateRequest) returns (GetExchangeRateResponse) {
    option (google.api.http) = {
        get: "/v1/exchange_rate"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
        description: "Get real-time exchange rates with USD as base"
        summary: "get exchange rates"
    };
  }
}